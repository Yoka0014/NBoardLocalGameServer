name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Only one deploy should ever be in flight; a second push while one is still waiting
# for the match queue to go idle should queue behind it, not race it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish NBoardLocalGameServer.csproj -c Release -o publish

      - name: Zip publish output
        run: (cd publish && zip -qr ../deploy.zip .)

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload build to S3
        run: aws s3 cp deploy.zip "s3://${{ secrets.DEPLOY_BUCKET }}/deploys/${{ github.sha }}.zip"

      - name: Wake EC2 instance if stopped
        run: |
          state=$(aws ec2 describe-instances --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [ "$state" != "running" ]; then
            echo "Instance is $state - starting it."
            aws ec2 start-instances --instance-ids "${{ secrets.EC2_INSTANCE_ID }}"
          fi
          aws ec2 wait instance-status-ok --instance-ids "${{ secrets.EC2_INSTANCE_ID }}"

      # apply-deploy.sh (already present on the instance, see deploy/README.md) waits for the
      # match queue to go idle before swapping the build and restarting the service. That wait
      # can legitimately take a long time, so this job only dispatches the command and briefly
      # confirms it started - it does NOT block on completion. This keeps GitHub Actions runner
      # minutes near-zero regardless of how long the current match queue takes to drain, and
      # avoids the 6-hour GitHub-hosted job time limit entirely. The command itself keeps running
      # on the instance via the SSM agent even after this job exits.
      - name: Dispatch deploy via SSM
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters "commands=[\"/home/ec2-user/deploy/apply-deploy.sh s3://${{ secrets.DEPLOY_BUCKET }}/deploys/${{ github.sha }}.zip\"],executionTimeout=[\"172800\"]" \
            --query 'Command.CommandId' --output text)
          echo "SSM command id: $command_id"

          # Short bounded poll (~2 min) just to catch immediate dispatch/permission failures -
          # NOT the full deploy wait.
          for _ in $(seq 1 24); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            case "$status" in
              Success) echo "Deploy already finished (queue was already idle)."; exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy failed immediately with status $status:"
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
                exit 1 ;;
              *) sleep 5 ;;
            esac
          done
          echo "Deploy dispatched and still waiting for the match queue to go idle on the instance."
          echo "It will complete on its own; check with:"
          echo "  aws ssm get-command-invocation --command-id $command_id --instance-id ${{ secrets.EC2_INSTANCE_ID }}"
